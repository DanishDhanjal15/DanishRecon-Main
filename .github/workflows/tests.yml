name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      DISABLE_GEMINI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (engine, CLI, dashboard, malware module - no GUI needed for tests)
        run: pip install -e ".[dev]"
      - name: Unit tests (offline - no scanning, no external tools)
        run: python -m unittest discover -s tests -v
      - name: Build the distribution and check its metadata
        run: |
          python -m build
          twine check dist/*
