[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "danishrecon"
version = "0.7.0"
description = "Security toolkit: recon + web vulnerability scanning, static malware analysis and network-traffic analysis. For authorized testing only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Danish Dhanjal" }]
keywords = ["security", "vulnerability-scanner", "reconnaissance", "pentest", "dast", "nuclei", "nmap", "malware-analysis", "pcap"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Core = scan engine + CLI. External tools (nmap, nuclei, katana, httpx, tshark, ...) are
# separate programs and are NOT installed by pip - see the README.
dependencies = [
    "requests>=2.31",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
gui     = ["PyQt5>=5.15"]
web     = ["fastapi>=0.110", "uvicorn>=0.29"]
malware = ["pefile>=2023.2.7", "yara-python>=4.3", "oletools>=0.60"]
ai      = ["google-genai>=1.0"]
openvas = ["python-gvm<22"]
scout   = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic", "httpx", "google-generativeai"]
all     = ["danishrecon[gui,web,malware,ai]"]
dev     = ["danishrecon[web,malware]", "build", "twine", "httpx"]

[project.scripts]
danishrecon           = "danishrecon.cli:main"
danishrecon-web       = "danishrecon.webapp.server:main"
danishrecon-preflight = "danishrecon.preflight:main"

[project.gui-scripts]
danishrecon-gui = "danishrecon.gui:main"

[project.urls]
Homepage = "https://github.com/DanishDhanjal15/DanishRecon-Main"
Issues = "https://github.com/DanishDhanjal15/DanishRecon-Main/issues"
Changelog = "https://github.com/DanishDhanjal15/DanishRecon-Main/blob/main/docs/CHANGES_AND_ROADMAP.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
danishrecon = ["yara_rules/*.yar", "webapp/*.html", "scout_chatbot/*.html", "scout_chatbot/*.txt"]
