<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scout — Security Assistant powered by DanishRecon</title>
<meta name="description" content="Scout is a beginner-friendly security chatbot that scans websites and explains vulnerabilities in plain English.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a14;--panel:#0b1121;--card:#111827;--card2:#0f172a;
  --border:#1a2436;--border2:#253249;
  --cyan:#00e5ff;--green:#10b981;--red:#ef4444;--orange:#f59e0b;--purple:#a78bfa;--blue:#3b82f6;--pink:#ec4899;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --glow:0 0 20px rgba(0,229,255,.12);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ── Header ── */
header{display:flex;align-items:center;gap:14px;padding:14px 24px;background:var(--panel);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.logo{width:40px;height:40px;border:1.5px solid var(--cyan);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,rgba(0,229,255,.08),transparent);box-shadow:var(--glow)}
.hd h1{font-size:16px;font-weight:700;color:var(--cyan);letter-spacing:-.3px}
.hd p{font-size:11px;color:var(--text2);margin-top:1px}
.badge{margin-left:auto;display:flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border2);border-radius:20px;font-size:10px;color:var(--text2);background:var(--card)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── Chips ── */
.chips{display:flex;gap:8px;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 14px;border:1px solid var(--border);border-radius:20px;font-size:11.5px;font-weight:500;color:var(--text2);cursor:pointer;background:var(--card);transition:all .2s}
.chip:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow);transform:translateY(-1px)}

/* ── Chat area ── */
#chat{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px;scroll-behavior:smooth}
#chat::-webkit-scrollbar{width:6px}
#chat::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── Messages ── */
.msg{display:flex;gap:10px;max-width:820px;animation:fadeUp .3s ease}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.av{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--card);border:1px solid var(--border)}
.msg.user .av{background:#1e3a5f;border-color:#2563eb40}
.bub{padding:14px 18px;border-radius:16px;font-size:13.5px;line-height:1.85;max-width:720px;background:var(--card);border:1px solid var(--border);border-top-left-radius:4px}
.msg.user .bub{background:linear-gradient(135deg,#1e3a5f,#172554);border-color:#2563eb30;border-top-left-radius:16px;border-top-right-radius:4px}
.bub strong{color:var(--cyan)}
.bub code{background:#0f1a2e;color:#7dd3fc;padding:2px 7px;border-radius:5px;font-family:'JetBrains Mono',monospace;font-size:11.5px}
.bub pre{background:#080e1e;border:1px solid var(--border);border-radius:10px;padding:14px;margin:10px 0;overflow-x:auto;position:relative}
.bub pre code{background:none;padding:0;color:#a5f3fc;font-size:11px}
.bub hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.bub blockquote{border-left:3px solid var(--cyan);padding:8px 14px;color:var(--text2);margin:8px 0;background:rgba(0,229,255,.04);border-radius:0 8px 8px 0;font-style:italic}
.bub h2,.bub h3{color:var(--cyan);margin:10px 0 6px;font-size:14px}

/* ── Copy button on code blocks ── */
.copy-btn{position:absolute;top:6px;right:6px;background:var(--border2);border:none;color:var(--text2);padding:3px 8px;border-radius:4px;font-size:9px;cursor:pointer;font-family:'Inter',sans-serif}
.copy-btn:hover{background:var(--cyan);color:#000}
.copy-btn.copied{background:var(--green);color:#fff}

/* ── CVE badge ── */
.cve-pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:6px;font-size:10.5px;font-weight:600;font-family:'JetBrains Mono',monospace;margin:3px 2px;border:1px solid}
.cve-critical{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.3);color:#fca5a5}
.cve-high{background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3);color:#fcd34d}
.cve-medium{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3);color:#93c5fd}

/* ── MITRE tag ── */
.mitre-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:9.5px;font-weight:600;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.25);color:var(--purple);margin:2px;font-family:'JetBrains Mono',monospace}

/* ── Risk grade card ── */
.grade-card{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:12px;background:var(--card2);border:1px solid var(--border2);margin:8px 0;font-size:14px;font-weight:700}
.grade-letter{font-size:32px;font-weight:800;line-height:1}
.grade-A{color:var(--green)}.grade-B{color:#84cc16}.grade-C{color:var(--orange)}.grade-D,.grade-E,.grade-F{color:var(--red)}

/* ── Progress bar ── */
.progress-wrap{width:100%;background:var(--card2);border-radius:8px;height:6px;margin:8px 0;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:8px;transition:width .5s ease}

/* ── Action buttons ── */
.action-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.action-btn{padding:7px 16px;border-radius:10px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border2);background:var(--card2);color:var(--text);transition:all .2s;font-family:'Inter',sans-serif}
.action-btn:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:var(--glow);transform:translateY(-1px)}
.action-btn:first-child{background:linear-gradient(135deg,rgba(0,229,255,.15),rgba(16,185,129,.1));border-color:rgba(0,229,255,.3);color:var(--cyan)}

/* ── Typing dots ── */
.dots span{display:inline-block;width:7px;height:7px;margin:0 2px;background:var(--text2);border-radius:50%;animation:bop 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes bop{0%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-6px);opacity:1}}

/* ── Input area ── */
.iw{padding:16px 24px;background:var(--panel);border-top:1px solid var(--border)}
.ir{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--border);border-radius:16px;padding:4px 4px 4px 18px;transition:border-color .2s}
.ir:focus-within{border-color:var(--cyan);box-shadow:var(--glow)}
#inp{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;padding:10px 0}
#inp::placeholder{color:var(--text3)}
#sb{background:linear-gradient(135deg,var(--cyan),#06b6d4);border:none;border-radius:12px;width:42px;height:42px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
#sb:hover{transform:scale(1.05);box-shadow:0 0 12px rgba(0,229,255,.3)}
#sb:active{transform:scale(.95)}
.hint{font-size:10.5px;color:var(--text3);text-align:center;margin-top:8px;letter-spacing:.2px}
.hint a{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<header>
  <div class="logo">🛡️</div>
  <div class="hd">
    <h1>Scout</h1>
    <p>Security Assistant · powered by DanishRecon</p>
  </div>
  <div class="badge"><div class="dot"></div>DanishRecon Engine</div>
</header>
<div class="chips">
  <div class="chip" onclick="go('scan example.com')">🔍 Scan a website</div>
  <div class="chip" onclick="go('check ssl for github.com')">🔐 Check SSL</div>
  <div class="chip" onclick="go('check headers for google.com')">🛡️ Check headers</div>
  <div class="chip" onclick="go('what is SQL injection?')">❓ SQL injection</div>
  <div class="chip" onclick="go('what is XSS?')">❓ XSS</div>
  <div class="chip" onclick="go('how do I fix FTP?')">🔧 Fix FTP</div>
  <div class="chip" onclick="go('how do I fix RDP?')">🔧 Fix RDP</div>
</div>
<div id="chat"></div>
<div class="iw">
  <div class="ir">
    <input id="inp" placeholder="Enter your domain, IP, or ask a security question..." autocomplete="off"/>
    <button id="sb" onclick="sendMsg()"><svg width="16" height="16" viewBox="0 0 24 24" fill="#080c18"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
  </div>
  <p class="hint">Scout scans targets you provide · Powered by <a href="#">DanishRecon</a> · Nothing stored</p>
</div>

<script>
const SID=localStorage.getItem("scout_sid")||(()=>{const s="s"+Math.random().toString(36).slice(2);localStorage.setItem("scout_sid",s);return s})();
const chat=document.getElementById("chat"),inp=document.getElementById("inp");

function se(){setTimeout(()=>chat.scrollTo({top:chat.scrollHeight,behavior:"smooth"}),60)}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

/* ── Markdown renderer ── */
function md(t){
  let h=t;
  // Code blocks
  h=h.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${esc(c.trim())}</code></pre>`);
  // Inline code
  h=h.replace(/`([^`]+)`/g,"<code>$1</code>");
  // Bold
  h=h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  // Italic
  h=h.replace(/_([^_]+)_/g,"<em>$1</em>");
  // Headers
  h=h.replace(/^### (.+)$/gm,"<h3>$1</h3>");
  h=h.replace(/^## (.+)$/gm,"<h2>$1</h2>");
  // HR
  h=h.replace(/^---$/gm,"<hr>");
  // Blockquotes
  h=h.replace(/^> (.+)$/gm,"<blockquote>$1</blockquote>");
  // Newlines
  h=h.replace(/\n/g,"<br>");
  // Fix code blocks
  h=h.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g,(_,c)=>`<pre><code>${c.replace(/<br>/g,"\n")}</code></pre>`);

  // ── Custom Scout tokens ──

  // CVE pills: @@CVE:CVE-2019-0708:9.8 — Title
  h=h.replace(/@@CVE:([^:]+):([\d.]+)\s*[—–-]\s*(.+?)(<br>|$)/g,(_,cve,cvss,title)=>{
    const sev=parseFloat(cvss)>=9?"critical":parseFloat(cvss)>=7?"high":"medium";
    return `<span class="cve-pill cve-${sev}">🔓 ${cve} · CVSS ${cvss}</span> ${title}<br>`;
  });
  // CVE pills (no title)
  h=h.replace(/@@CVE:([^:]+):([\d.]+)/g,(_,cve,cvss)=>{
    const sev=parseFloat(cvss)>=9?"critical":parseFloat(cvss)>=7?"high":"medium";
    return `<span class="cve-pill cve-${sev}">🔓 ${cve} · CVSS ${cvss}</span>`;
  });

  // MITRE tags: @@MITRE:T1190:Initial Access
  h=h.replace(/@@MITRE:([^:]+):(.+?)(<br>|$)/g,(_,tid,tactic)=>{
    return `<span class="mitre-tag">⚔️ ${tid} · ${tactic}</span><br>`;
  });

  // Grade card: @@GRADE:D:🔴
  h=h.replace(/@@GRADE:([A-F]):(.)(<br>|$)/g,(_,g,e)=>{
    return `<div class="grade-card"><span class="grade-letter grade-${g}">${g}</span><span>${e} Security Grade</span></div><br>`;
  });

  // Progress bar: @@PROGRESS:2:7
  h=h.replace(/@@PROGRESS:(\d+):(\d+)(<br>|$)/g,(_,cur,tot)=>{
    const pct=Math.round((parseInt(cur)/parseInt(tot))*100);
    return `<div class="progress-wrap"><div class="progress-fill" style="width:${pct}%"></div></div>`;
  });

  // Action buttons: @@BUTTONS:Label1|Label2|Label3
  h=h.replace(/@@BUTTONS:(.+?)(<br>|$)/g,(_,btns)=>{
    const labels=btns.split("|").map(b=>b.trim());
    let html='<div class="action-btns">';
    labels.forEach(l=>{
      html+=`<button class="action-btn" onclick="go('${l.replace(/[➜🔍📋!]/g,'').trim()}')">${l}</button>`;
    });
    html+='</div>';
    return html;
  });

  return h;
}

/* ── Message rendering ── */
function addUser(t){
  const d=document.createElement("div");
  d.className="msg user";
  d.innerHTML=`<div class="av">👤</div><div class="bub">${esc(t)}</div>`;
  chat.appendChild(d);se();
}

function addBot(t){
  const d=document.createElement("div");
  d.className="msg bot";
  const bubHTML=md(t);
  d.innerHTML=`<div class="av">🛡️</div><div class="bub">${bubHTML}</div>`;
  chat.appendChild(d);
  // Add copy buttons to code blocks
  d.querySelectorAll("pre").forEach(pre=>{
    const btn=document.createElement("button");
    btn.className="copy-btn";btn.textContent="Copy";
    btn.onclick=()=>{
      navigator.clipboard.writeText(pre.textContent.replace("Copy","").trim());
      btn.textContent="Copied!";btn.classList.add("copied");
      setTimeout(()=>{btn.textContent="Copy";btn.classList.remove("copied")},1500);
    };
    pre.style.position="relative";pre.appendChild(btn);
  });
  se();return d;
}

function addTyping(){
  const d=document.createElement("div");
  d.className="msg bot";d.id="typing";
  d.innerHTML=`<div class="av">🛡️</div><div class="bub"><div class="dots"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(d);se();return d;
}

function go(t){inp.value=t;sendMsg()}
inp.addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg()});

let sending=false;
async function sendMsg(){
  if(sending)return;
  const msg=inp.value.trim();if(!msg)return;
  inp.value="";addUser(msg);
  const el=addTyping();
  sending=true;
  try{
    const r=await fetch("/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:SID,message:msg})});
    const d=await r.json();el.remove();
    addBot(d.reply||"Error — try again.");
  }catch(e){
    el.remove();addBot("⚠️ Cannot connect to Scout.\n\nMake sure the server is running:\n`python scout.py`");
  }
  sending=false;
}

/* ── Welcome message ── */
addBot("👋 Hi! I'm **Scout** — your personal security guide.\n\nI'll scan your website and explain every vulnerability in **plain English**, with step-by-step guides to fix each one. No technical knowledge needed!\n\n**Try saying:**\n• `scan example.com` — full security check\n• `check ssl for mysite.com` — verify SSL\n• `what is SQL injection?` — learn security topics\n• `how do I fix FTP?` — step-by-step guides\n\n@@BUTTONS:🔍 Scan a website|❓ What can you do?|🔧 Fix a vulnerability");
</script>
</body>
</html>
